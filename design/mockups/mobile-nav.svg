<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Навигационная схема мобильного приложения (черновик)</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B5FD9"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#F5F7FA"/>

  <!-- Экран: список -->
  <rect x="40" y="60" width="220" height="400" rx="20" fill="#FFFFFF" stroke="#1F2937"/>
  <rect x="40" y="60" width="220" height="44" rx="20" fill="#E5E7EB"/>
  <text x="60" y="88" fill="#1F2937" font-weight="700">Заказы</text>
  <text x="60" y="140" fill="#6B7280">Список заказов</text>
  <rect x="60" y="160" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="60" y="210" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="60" y="390" width="180" height="48" rx="8" fill="#2B5FD9"/>
  <text x="104" y="419" fill="#FFFFFF" font-weight="700">Новый заказ</text>
  <text x="40" y="490" fill="#1F2937" font-weight="700">1. Список</text>

  <!-- Экран: детали -->
  <rect x="340" y="60" width="220" height="400" rx="20" fill="#FFFFFF" stroke="#1F2937"/>
  <rect x="340" y="60" width="220" height="44" rx="20" fill="#E5E7EB"/>
  <text x="360" y="88" fill="#1F2937" font-weight="700">Заказ</text>
  <text x="360" y="140" fill="#6B7280">Детали заказа</text>
  <rect x="360" y="160" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="340" y="490" fill="#1F2937" font-weight="700">2. Детали</text>

  <!-- Экран: форма -->
  <rect x="640" y="60" width="220" height="400" rx="20" fill="#FFFFFF" stroke="#1F2937"/>
  <rect x="640" y="60" width="220" height="44" rx="20" fill="#E5E7EB"/>
  <text x="660" y="88" fill="#1F2937" font-weight="700">Новый заказ</text>
  <text x="660" y="140" fill="#6B7280">Форма заказа</text>
  <rect x="660" y="160" width="180" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="660" y="206" width="180" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="640" y="490" fill="#1F2937" font-weight="700">3. Форма</text>

  <!-- Переходы -->
  <line x1="260" y1="180" x2="340" y2="180" stroke="#2B5FD9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="170" fill="#2B5FD9" font-size="11">тап по заказу</text>
  <path d="M260 414 C 450 500, 560 500, 640 300" fill="none" stroke="#2B5FD9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="510" fill="#2B5FD9" font-size="11">кнопка «Новый заказ»</text>

  <text x="40" y="30" fill="#6B7280" font-size="11">Стековая навигация (React Navigation). Возврат на предыдущий экран — кнопка «Назад».</text>
</svg>
